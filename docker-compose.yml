services:
  postgres:
    image: postgres:16
    container_name: fleet-postgres
    restart: always
    environment:
      POSTGRES_USER: fleetuser
      POSTGRES_PASSWORD: fleetpass
      POSTGRES_DB: fleetdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  
  backend:
    build: ./backend
    container_name: fleet-backend
    restart: always
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./infra:/app/infra
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://fleetuser:fleetpass@postgres:5432/fleetdb
  agent:
    build: ./agent
    container_name: fleet-agent
    restart: always
  prometheus:
    image: prom/prometheus:latest
    container_name: fleet-prometheus
    restart: always
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.enable-lifecycle'
  grafana:
    image: grafana/grafana:latest
    container_name: fleet-grafana
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
volumes:
  pgdata:
  grafana-data: